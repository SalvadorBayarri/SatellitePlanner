<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 270" width="1120" height="270" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <rect width="1120" height="270" rx="12" fill="#070d1b" stroke="#1e293b" stroke-width="1.5"/>

  <text x="36" y="36" fill="#38bdf8" font-size="12.5" font-weight="700" letter-spacing="0.8">ACQUISITION REQUEST &amp; EXECUTION LIFECYCLE (NATS JETSTREAM + SSE)</text>

  <!-- Step 1: Queued -->
  <rect x="32" y="75" width="136" height="68" rx="8" fill="#11223d" stroke="#38bdf8" stroke-width="1.4"/>
  <text x="100" y="102" text-anchor="middle" fill="#7dd3fc" font-size="12" font-weight="700">1. Queued</text>
  <text x="100" y="120" text-anchor="middle" fill="#cbd5e1" font-size="9.5">Single / Batch / Auto</text>
  <text x="100" y="133" text-anchor="middle" fill="#94a3b8" font-size="9">In Requests Queue</text>

  <!-- Arrow 1->2 -->
  <line x1="168" y1="109" x2="208" y2="109" stroke="#38bdf8" stroke-width="1.8"/>
  <polygon points="208,104 218,109 208,114" fill="#38bdf8"/>

  <!-- Step 2: Evaluating -->
  <rect x="218" y="75" width="150" height="68" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.4"/>
  <text x="293" y="102" text-anchor="middle" fill="#a5b4fc" font-size="12" font-weight="700">2. Evaluating (10s)</text>
  <text x="293" y="120" text-anchor="middle" fill="#cbd5e1" font-size="9.5">Active Fleet Pass Search</text>
  <text x="293" y="133" text-anchor="middle" fill="#94a3b8" font-size="9">ASAP or Absolute UTC</text>

  <!-- Split Arrows from Evaluating -->
  <path d="M368 96 L425 68" fill="none" stroke="#60a5fa" stroke-width="1.6"/>
  <polygon points="423,63 434,65 427,73" fill="#60a5fa"/>
  <text x="394" y="68" text-anchor="middle" fill="#93c5fd" font-size="9" font-weight="600">Manual</text>

  <path d="M368 122 L425 148" fill="none" stroke="#22d3ee" stroke-width="1.6"/>
  <polygon points="427,143 434,151 423,153" fill="#22d3ee"/>
  <text x="394" y="152" text-anchor="middle" fill="#67e8f9" font-size="9" font-weight="600">Auto</text>

  <!-- Step 3A: Reserved -->
  <rect x="434" y="36" width="146" height="58" rx="8" fill="#172554" stroke="#60a5fa" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="507" y="61" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="700">3a. Reserved</text>
  <text x="507" y="78" text-anchor="middle" fill="#bfdbfe" font-size="9.5">60s Confirm Countdown</text>

  <!-- Arrow 3A -> 3B (Confirm) -->
  <line x1="507" y1="94" x2="507" y2="126" stroke="#38bdf8" stroke-width="1.6"/>
  <polygon points="502,124 507,134 512,124" fill="#38bdf8"/>
  <text x="536" y="115" fill="#7dd3fc" font-size="9" font-weight="600">Confirm</text>

  <!-- Step 3B: Pending -->
  <rect x="434" y="134" width="146" height="62" rx="8" fill="#0f2942" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="507" y="160" text-anchor="middle" fill="#67e8f9" font-size="12" font-weight="700">3b. Pending</text>
  <text x="507" y="178" text-anchor="middle" fill="#bae6fd" font-size="9.5">Scheduled in Global Plan</text>

  <!-- Arrow Pending -> Acquiring -->
  <line x1="580" y1="165" x2="636" y2="165" stroke="#f59e0b" stroke-width="1.8"/>
  <polygon points="636,160 646,165 636,170" fill="#f59e0b"/>
  <text x="608" y="156" text-anchor="middle" fill="#fcd34d" font-size="9">T - D/2</text>

  <!-- Step 4: Acquiring -->
  <rect x="646" y="134" width="146" height="62" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="719" y="160" text-anchor="middle" fill="#fde68a" font-size="12" font-weight="700">4. Acquiring</text>
  <text x="719" y="178" text-anchor="middle" fill="#fef3c7" font-size="9.5">Active Pass Capture</text>

  <!-- Split Arrows from Acquiring to Completed / Failed -->
  <path d="M792 152 L852 106" fill="none" stroke="#10b981" stroke-width="1.8"/>
  <polygon points="848,102 859,101 854,110" fill="#10b981"/>
  <text x="818" y="114" fill="#6ee7b7" font-size="9" font-weight="600">90% Pass</text>

  <path d="M792 178 L852 206" fill="none" stroke="#ef4444" stroke-width="1.8"/>
  <polygon points="854,201 859,210 848,210" fill="#ef4444"/>
  <text x="818" y="206" fill="#fca5a5" font-size="9" font-weight="600">10% / Fail</text>

  <!-- Step 5A: Completed -->
  <rect x="860" y="64" width="224" height="62" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="972" y="90" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="700">5a. Completed</text>
  <text x="972" y="108" text-anchor="middle" fill="#d1fae5" font-size="9.5">256×256 Satellite Image Stored</text>

  <!-- Step 5B: Failed & Reprogrammed -->
  <rect x="860" y="176" width="106" height="62" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="913" y="202" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="700">5b. Failed</text>
  <text x="913" y="220" text-anchor="middle" fill="#fecaca" font-size="9">No Image</text>

  <line x1="966" y1="207" x2="986" y2="207" stroke="#a855f7" stroke-width="1.8"/>
  <polygon points="984,202 992,207 984,212" fill="#a855f7"/>

  <rect x="992" y="176" width="96" height="62" rx="8" fill="#2e1065" stroke="#a855f7" stroke-width="1.5"/>
  <text x="1040" y="202" text-anchor="middle" fill="#e9d5ff" font-size="10.5" font-weight="700">Reprogrammed</text>
  <text x="1040" y="220" text-anchor="middle" fill="#ddd6fe" font-size="8.5">New Request</text>
</svg>
