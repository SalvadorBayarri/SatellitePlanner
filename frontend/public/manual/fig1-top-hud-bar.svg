<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 260" width="1120" height="260" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1528"/>
      <stop offset="100%" stop-color="#060b16"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f1d36" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0b172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1120" height="260" rx="12" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top HUD Bar Mockup -->
  <rect x="20" y="72" width="1080" height="64" rx="10" fill="url(#barGrad)" stroke="#334155" stroke-width="1.2"/>

  <!-- Brand Left -->
  <circle cx="52" cy="104" r="16" fill="#0e2942" stroke="#22d3ee" stroke-width="1.5"/>
  <path d="M46 104 h12 M52 98 v12" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round"/>
  <text x="78" y="100" fill="#f8fafc" font-size="13" font-weight="700" letter-spacing="0.8">SATELLITE PLANNER</text>
  <text x="78" y="116" fill="#38bdf8" font-size="9.5" font-weight="600" letter-spacing="0.5">POLAR CONSTELLATION CONTROL</text>

  <!-- 1. Fleet & Health Pills -->
  <rect x="268" y="88" width="34" height="32" rx="16" fill="#062e26" stroke="#10b981" stroke-width="1.2"/>
  <circle cx="285" cy="104" r="5" fill="#10b981"/>
  <rect x="308" y="88" width="34" height="32" rx="16" fill="#062e26" stroke="#10b981" stroke-width="1.2"/>
  <path d="M317 104 h4 l3 -6 l4 12 l3 -6 h4" fill="none" stroke="#10b981" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 2. Start / End Button -->
  <rect x="352" y="88" width="74" height="32" rx="8" fill="#063e31" stroke="#10b981" stroke-width="1.4"/>
  <polygon points="368,99 368,109 377,104" fill="#34d399"/>
  <text x="384" y="108" fill="#ecfdf5" font-size="12" font-weight="700">Start</text>

  <!-- 3. Image Requests Dropdown -->
  <rect x="436" y="88" width="138" height="32" rx="8" fill="#11223d" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="452" y="108" fill="#e0f2fe" font-size="11.5" font-weight="600">Image Requests ▾</text>

  <!-- 4. Stats Dropdown -->
  <rect x="584" y="88" width="76" height="32" rx="8" fill="#11223d" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="602" y="108" fill="#e0f2fe" font-size="11.5" font-weight="600">Stats ▾</text>

  <!-- 5. See Acquisition Plan -->
  <rect x="670" y="88" width="154" height="32" rx="8" fill="#162a4a" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="686" y="108" fill="#f0f9ff" font-size="11.5" font-weight="600">See Acquisition Plan</text>

  <!-- 6. Prev / Next Acquisition Group -->
  <rect x="834" y="88" width="150" height="32" rx="8" fill="#11223d" stroke="#475569" stroke-width="1.2"/>
  <text x="845" y="108" fill="#94a3b8" font-size="12" font-weight="700">‹</text>
  <text x="862" y="108" fill="#e2e8f0" font-size="11" font-weight="600">Next Acquisition</text>
  <text x="971" y="108" fill="#94a3b8" font-size="12" font-weight="700">›</text>

  <!-- 7. Orbiting Toggle -->
  <rect x="992" y="88" width="64" height="32" rx="8" fill="#0c2d48" stroke="#22d3ee" stroke-width="1.2"/>
  <text x="1002" y="108" fill="#67e8f9" font-size="11" font-weight="600">Orbiting</text>

  <!-- 8. Help (?) Button -->
  <rect x="1062" y="88" width="32" height="32" rx="8" fill="#172554" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="1074" y="109" fill="#38bdf8" font-size="15" font-weight="800">?</text>

  <!-- Callout Lines & Labels (Top & Bottom) -->
  <!-- Callout 1: Fleet & Health -->
  <line x1="305" y1="88" x2="305" y2="46" stroke="#10b981" stroke-width="1.2" stroke-dasharray="3,3"/>
  <rect x="215" y="18" width="180" height="28" rx="6" fill="#062e26" stroke="#10b981" stroke-width="1"/>
  <text x="305" y="36" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="600">1. Fleet &amp; System Health</text>

  <!-- Callout 2: Start / End -->
  <line x1="389" y1="120" x2="389" y2="175" stroke="#34d399" stroke-width="1.2" stroke-dasharray="3,3"/>
  <rect x="290" y="175" width="198" height="44" rx="6" fill="#062e26" stroke="#10b981" stroke-width="1"/>
  <text x="389" y="193" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="700">2. Session Control (Start / End)</text>
  <text x="389" y="209" text-anchor="middle" fill="#a7f3d0" font-size="10">Initializes or stops the 30-min plan</text>

  <!-- Callout 3: Image Requests -->
  <line x1="505" y1="88" x2="505" y2="46" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <rect x="415" y="18" width="185" height="28" rx="6" fill="#0c2d48" stroke="#38bdf8" stroke-width="1"/>
  <text x="507" y="36" text-anchor="middle" fill="#7dd3fc" font-size="11" font-weight="600">3. Image Requests Menu</text>

  <!-- Callout 4: Stats -->
  <line x1="622" y1="120" x2="622" y2="175" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <rect x="530" y="175" width="184" height="44" rx="6" fill="#0c2d48" stroke="#38bdf8" stroke-width="1"/>
  <text x="622" y="193" text-anchor="middle" fill="#7dd3fc" font-size="11" font-weight="700">4. Real-Time Stats</text>
  <text x="622" y="209" text-anchor="middle" fill="#bae6fd" font-size="10">Status Bars &amp; Timeline Charts</text>

  <!-- Callout 5: Global Plan -->
  <line x1="747" y1="88" x2="747" y2="46" stroke="#60a5fa" stroke-width="1.2" stroke-dasharray="3,3"/>
  <rect x="650" y="18" width="194" height="28" rx="6" fill="#172554" stroke="#60a5fa" stroke-width="1"/>
  <text x="747" y="36" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600">5. Global Acquisition Plan</text>

  <!-- Callout 6: Chronological Stepper -->
  <line x1="909" y1="120" x2="909" y2="175" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <rect x="810" y="175" width="198" height="44" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <text x="909" y="193" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="700">6. Acquisition Quick-Jump</text>
  <text x="909" y="209" text-anchor="middle" fill="#cbd5e1" font-size="10">Step ‹ / › or jump to Next in UTC</text>

  <!-- Callout 7 & 8: Orbit & Help -->
  <line x1="1078" y1="88" x2="1078" y2="46" stroke="#22d3ee" stroke-width="1.2" stroke-dasharray="3,3"/>
  <rect x="930" y="18" width="170" height="28" rx="6" fill="#0c2d48" stroke="#22d3ee" stroke-width="1"/>
  <text x="1015" y="36" text-anchor="middle" fill="#67e8f9" font-size="11" font-weight="600">7. Globe Spin &amp; ? Help</text>
</svg>
