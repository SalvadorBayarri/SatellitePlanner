<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 460" width="1120" height="460" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <defs>
    <radialGradient id="globeGrad" cx="42%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="55%" stop-color="#0f2952"/>
      <stop offset="100%" stop-color="#061024"/>
    </radialGradient>
    <radialGradient id="atmoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="82%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="95%" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Space Canvas Background -->
  <rect width="1120" height="460" rx="12" fill="#050914" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Subtle Starfield -->
  <circle cx="90" cy="70" r="1.2" fill="#94a3b8"/>
  <circle cx="240" cy="40" r="1.5" fill="#e2e8f0"/>
  <circle cx="820" cy="60" r="1.2" fill="#94a3b8"/>
  <circle cx="760" cy="390" r="1.4" fill="#cbd5e1"/>
  <circle cx="420" cy="410" r="1.1" fill="#64748b"/>

  <!-- Left Floating Panel: Satellite Info Panel -->
  <rect x="24" y="28" width="295" height="398" rx="10" fill="#0b1528" fill-opacity="0.92" stroke="#1e3a5f" stroke-width="1.4"/>
  <text x="42" y="54" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="0.8">SATELLITE INFORMATION PANEL</text>
  <rect x="42" y="68" width="182" height="28" rx="6" fill="#11223d" stroke="#334155"/>
  <text x="54" y="86" fill="#f8fafc" font-size="11.5" font-weight="600">SAT-POLAR-07 (0b07) ▾</text>
  <!-- Active Status Badge Button -->
  <rect x="232" y="68" width="68" height="28" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.3"/>
  <circle cx="244" cy="82" r="4" fill="#34d399"/>
  <text x="254" y="86" fill="#ecfdf5" font-size="10.5" font-weight="700">ACTIVE</text>

  <!-- Telemetry Grid -->
  <rect x="42" y="108" width="124" height="46" rx="6" fill="#0f1d36" stroke="#1e293b"/>
  <text x="52" y="124" fill="#94a3b8" font-size="9.5">LATITUDE</text>
  <text x="52" y="143" fill="#f8fafc" font-size="13" font-weight="700">41.3851° N</text>

  <rect x="176" y="108" width="124" height="46" rx="6" fill="#0f1d36" stroke="#1e293b"/>
  <text x="186" y="124" fill="#94a3b8" font-size="9.5">LONGITUDE</text>
  <text x="186" y="143" fill="#f8fafc" font-size="13" font-weight="700">2.1734° E</text>

  <rect x="42" y="162" width="124" height="46" rx="6" fill="#0f1d36" stroke="#1e293b"/>
  <text x="52" y="178" fill="#94a3b8" font-size="9.5">ALTITUDE</text>
  <text x="52" y="197" fill="#38bdf8" font-size="13" font-weight="700">618 km</text>

  <rect x="176" y="162" width="124" height="46" rx="6" fill="#0f1d36" stroke="#1e293b"/>
  <text x="186" y="178" fill="#94a3b8" font-size="9.5">ORBIT PLANE</text>
  <text x="186" y="197" fill="#a78bfa" font-size="13" font-weight="700">-54.0°</text>

  <!-- Scheduled Acquisitions Mini Table -->
  <text x="42" y="230" fill="#94a3b8" font-size="10" font-weight="700">SCHEDULED ACQUISITIONS (SAT-POLAR-07)</text>
  <rect x="42" y="238" width="258" height="32" rx="5" fill="#162a4a" stroke="#38bdf8" stroke-width="1"/>
  <text x="52" y="258" fill="#e2e8f0" font-size="10.5" font-weight="600">21:42:10 UTC</text>
  <rect x="148" y="245" width="64" height="18" rx="9" fill="#064e3b"/>
  <text x="180" y="257" text-anchor="middle" fill="#34d399" font-size="9.5" font-weight="700">Completed</text>
  <rect x="220" y="245" width="72" height="18" rx="4" fill="#3b0764" stroke="#a855f7" stroke-width="0.8"/>
  <text x="256" y="257" text-anchor="middle" fill="#e9d5ff" font-size="9.5" font-weight="600">Reprogram</text>

  <!-- Captured Image Preview Box -->
  <rect x="42" y="280" width="258" height="128" rx="6" fill="#091326" stroke="#1e293b"/>
  <text x="54" y="300" fill="#94a3b8" font-size="10" font-weight="600">ACQUIRED SATELLITE IMAGE (256×256)</text>
  <rect x="54" y="308" width="88" height="88" rx="6" fill="#132e35" stroke="#22d3ee" stroke-width="1"/>
  <path d="M54 368 Q80 345 105 360 T142 340 L142 396 L54 396 Z" fill="#0d9488" fill-opacity="0.5"/>
  <circle cx="115" cy="330" r="10" fill="#38bdf8" fill-opacity="0.35"/>
  <text x="154" y="332" fill="#e2e8f0" font-size="10.5" font-weight="600">Target: 41.39°N, 2.17°E</text>
  <text x="154" y="350" fill="#94a3b8" font-size="10">Footprint: 300 × 300 km</text>
  <text x="154" y="368" fill="#34d399" font-size="10" font-weight="600">Status: Completed</text>

  <!-- Center 3D Earth Globe -->
  <circle cx="575" cy="230" r="185" fill="url(#atmoGlow)"/>
  <circle cx="575" cy="230" r="165" fill="url(#globeGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>

  <!-- Latitude / Longitude Grid Curves -->
  <ellipse cx="575" cy="230" rx="165" ry="55" fill="none" stroke="#38bdf8" stroke-opacity="0.18" stroke-width="1"/>
  <ellipse cx="575" cy="230" rx="95" ry="165" fill="none" stroke="#38bdf8" stroke-opacity="0.18" stroke-width="1"/>

  <!-- Selected Polar Orbit Ring (Magenta/Cyan) -->
  <ellipse cx="575" cy="230" rx="62" ry="182" transform="rotate(-14 575 230)" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Satellite 3D Marker on Orbit -->
  <circle cx="552" cy="138" r="7" fill="#22d3ee" stroke="#0f172a" stroke-width="2"/>
  <!-- 300x300 km Ground Footprint Square -->
  <polygon points="530,152 574,145 580,182 536,189" fill="#22d3ee" fill-opacity="0.18" stroke="#22d3ee" stroke-width="1.5"/>

  <!-- Pulsing Acquisition Target Footprint on Globe -->
  <polygon points="585,215 625,210 630,244 590,249" fill="#f59e0b" fill-opacity="0.25" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="607" cy="230" r="24" fill="none" stroke="#fbbf24" stroke-width="1.4" stroke-dasharray="4,3"/>

  <!-- Callouts on Globe -->
  <line x1="552" y1="138" x2="680" y2="82" stroke="#22d3ee" stroke-width="1.3"/>
  <rect x="680" y="62" width="190" height="36" rx="6" fill="#0c2d48" stroke="#22d3ee" stroke-width="1"/>
  <text x="775" y="78" text-anchor="middle" fill="#67e8f9" font-size="10.5" font-weight="700">Active Satellite &amp; Orbit Track</text>
  <text x="775" y="92" text-anchor="middle" fill="#bae6fd" font-size="9.5">300 × 300 km ground footprint</text>

  <line x1="630" y1="228" x2="720" y2="195" stroke="#fbbf24" stroke-width="1.3"/>
  <rect x="720" y="175" width="185" height="36" rx="6" fill="#3b2506" stroke="#f59e0b" stroke-width="1"/>
  <text x="812" y="191" text-anchor="middle" fill="#fde68a" font-size="10.5" font-weight="700">Scheduled Acquisition Target</text>
  <text x="812" y="205" text-anchor="middle" fill="#fef3c7" font-size="9.5">Color-coded by status on Globe</text>

  <!-- Right Bottom Floating Panel: Orbital Time & Simulation Speed Control -->
  <rect x="790" y="285" width="306" height="142" rx="10" fill="#0b1528" fill-opacity="0.94" stroke="#1e3a5f" stroke-width="1.4"/>
  <text x="808" y="310" fill="#38bdf8" font-size="10.5" font-weight="700" letter-spacing="0.6">ORBITAL TIME &amp; SIMULATION SPEED</text>
  <rect x="1036" y="296" width="44" height="20" rx="10" fill="#064e3b" stroke="#10b981"/>
  <text x="1058" y="310" text-anchor="middle" fill="#34d399" font-size="9.5" font-weight="700">LIVE</text>
  <text x="808" y="338" fill="#f8fafc" font-size="14" font-weight="700">2026-10-28 21:42:18 UTC</text>
  <text x="808" y="362" fill="#94a3b8" font-size="10">Simulation Speed: 1× (Real-Time)</text>
  <line x1="808" y1="378" x2="1076" y2="378" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  <line x1="808" y1="378" x2="860" y2="378" stroke="#22d3ee" stroke-width="6" stroke-linecap="round"/>
  <circle cx="860" cy="378" r="7" fill="#38bdf8"/>
  <rect x="808" y="396" width="150" height="22" rx="5" fill="#11223d" stroke="#334155"/>
  <text x="883" y="411" text-anchor="middle" fill="#bae6fd" font-size="10" font-weight="600">Reset to Real Time (UTC)</text>
</svg>
